# Curated registry of remote agent skills hosted on gitlab.com.
#
# Each entry points at a directory in a public gitlab.com project that
# contains a spec-compliant SKILL.md plus any supporting files. glab
# fetches the entire directory tree at install time.
#
# To add an entry, prefer the generator:
#
#   go run ./scripts/skills/add-remote <full-url-to-skill-directory>
#
# Manual additions need the same fields the generator produces. The entry
# name is the public skill name and install directory. It normally matches
# the SKILL.md frontmatter `name`; when it differs (for example `orbit`
# installing the upstream `orbit-wrapper`), glab rewrites the frontmatter
# `name` to the entry name at install time. Generate such entries with
# `--name`.
version: 1
skills:
  - name: orbit
    description: Use the `glab orbit` CLI for questions about code structure, blast radius, cross-project links, and relationships across GitLab entities, and to build a repo map. It works on hosted or local data. Skip it for single-entity lookups or writes that `glab` already handles.
    project: gitlab-org/orbit/knowledge-graph
    ref: latest
    path: skills/orbit-wrapper
