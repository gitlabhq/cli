# Vale configuration file.
#
# For more information, see https://vale.sh/docs/vale-ini.

StylesPath = docs/.vale
MinAlertLevel = suggestion

IgnoredScopes = code, text.frontmatter.redirect_to, text.frontmatter.info, text.frontmatter.type

[*.md]
BasedOnStyles = gitlab_base

# Ignore SVG markup
TokenIgnores = (\*\*\{\w*\}\*\*)

[docs/source/**/*.md]
BasedOnStyles = gitlab_base, gitlab_docs

# Ignore SVG markup
TokenIgnores = (\*\*\{\w*\}\*\*)

# docs/source is generated from the Go help text in internal/commands.
# Full URLs to docs.gitlab.com are correct here.
gitlab_docs.RelativeLinks = NO

gitlab_docs.InternalLinksCode = NO
